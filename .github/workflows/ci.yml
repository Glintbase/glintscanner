name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web app (typecheck, test, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mcp:
    name: MCP package (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json
      # The package bundles ../src/lib/scanner, whose dependencies live in the root install.
      - run: npm ci --legacy-peer-deps
        working-directory: .
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      # stdio server: it waits on stdin, so only check the bundle was produced.
      - run: test -s dist/index.js

  cli:
    name: CLI package (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: .
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --version
