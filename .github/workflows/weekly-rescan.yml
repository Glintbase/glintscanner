name: Weekly leaderboard rescan

# Rescans every leaderboard company with the current scoring engine and saves the
# results (sites that never respond are reported TARGET_UNREACHABLE and not saved).
# Requires repository secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: 'Save results (unchecked = dry run)'
        type: boolean
        default: false
      only:
        description: 'Optional comma-separated hosts to rescan'
        type: string
        default: ''

concurrency:
  group: leaderboard-rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Rescan leaderboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          ONLY: ${{ inputs.only }}
          # The MCP Registry search is slow; give it longer than live scans get.
          GLINTBASE_REGISTRY_TIMEOUT_MS: '45000'
        run: |
          set -euo pipefail
          ARGS=(--force --concurrency 4)
          if [ "$APPLY" = "true" ]; then ARGS+=(--apply); fi
          if [ -n "${ONLY:-}" ]; then ARGS+=(--only "$ONLY"); fi
          npx tsx scripts/rescan-leaderboard.ts "${ARGS[@]}"
